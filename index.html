<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KISO Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar + tab strip, one working column (max 1180px); tables scroll inside their own box */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --sunk:#e8eef0; --line:#d5dfe2;
  --ink:#14262d; --muted:#5b6f76; --accent:#0f7a7a; --accent-ink:#ffffff; --accent-soft:#d6efee;
  --good:#1d7a45; --good-soft:#dcf1e4; --warn:#a2610b; --warn-soft:#fbecd2; --bad:#b4342b; --bad-soft:#f8dedb;
  --s1:#008f88; --s2:#7656d8; --tt:#15803d; --sp:#e8551e; --neg:#c2410c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --surface:#152225; --sunk:#1b2b2f; --line:#2a3d42;
  --ink:#e3eef0; --muted:#93a8ae; --accent:#4cc4bf; --accent-ink:#0b1a1b; --accent-soft:#163a3a;
  --good:#5fcf8c; --good-soft:#163526; --warn:#e7aa52; --warn-soft:#3a2b14; --bad:#f08077; --bad-soft:#3d1c19; --s1:#2aa9a2; --s2:#9580e8; --tt:#4ade80; --sp:#ff8a5c; --neg:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --surface:#152225; --sunk:#1b2b2f; --line:#2a3d42;
  --ink:#e3eef0; --muted:#93a8ae; --accent:#4cc4bf; --accent-ink:#0b1a1b; --accent-soft:#163a3a;
  --good:#5fcf8c; --good-soft:#163526; --warn:#e7aa52; --warn-soft:#3a2b14; --bad:#f08077; --bad-soft:#3d1c19; --s1:#2aa9a2; --s2:#9580e8; --tt:#4ade80; --sp:#ff8a5c; --neg:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
.top .sp{flex:1}
.month{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
@media (min-width:760px){nav{flex-wrap:wrap;overflow:visible;row-gap:0}}
@media (max-width:759px){nav{scrollbar-width:thin;padding-bottom:2px}nav::-webkit-scrollbar{display:block;height:3px}nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}}
nav button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:10px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:grid;gap:20px}
h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.grid2>*{min-width:0}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
.wrapcell{white-space:normal;min-width:180px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.neg{color:var(--bad)}.pos{color:var(--good)}.mut{color:var(--muted)}
button.btn,label.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:5px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input[type=month]{width:auto}
.field{display:grid;gap:4px}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,.7fr) minmax(0,1.1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.item{grid-template-columns:1fr 1fr}.item .field:first-child{grid-column:1/-1}}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars div.z{background:var(--line)}
.barax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.pl{display:grid;gap:0}
.pl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.pl div.t{font-weight:700;border-bottom:1px solid var(--line)}
.pl div.big{font-family:var(--display);font-size:18px;border:0;padding-top:12px}
.pl div.ind span:first-child{padding-left:14px;color:var(--muted)}
.pl3 div{display:grid!important;grid-template-columns:minmax(0,1fr) 52px auto;gap:10px;align-items:baseline}
.pl3 div>span:last-child{text-align:right}
.pl3 .plp{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl3 .plh{border:0!important;padding:0 0 2px!important}
.pl3 div.ind2{padding:4px 0;border-bottom:1px dotted var(--line);font-size:13px}
.pl3 div.ind2 span:first-child{padding-left:28px;color:var(--muted)}
.pl3 div.ind2 span:last-child{color:var(--muted)}
table.pc{min-width:560px}
table.pc td,table.pc th{vertical-align:top;white-space:nowrap}
table.pc td:first-child{white-space:normal;min-width:180px}
table.pc small{display:block;font-size:11px;color:var(--muted);font-weight:400}
table.pc .pc-sub{padding-left:22px;color:var(--muted);font-size:13px}
table.pc tr.pc-t td{font-weight:700;border-top:1px solid var(--line)}
table.pc tr.pc-k td{background:var(--sunk)}
table.pc .pc-tot{border-left:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,20,24,.45)}
dialog form{display:grid;gap:14px;padding:18px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.dfoot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:50}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 12px;font:600 13px var(--body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
<style>
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.acct[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.acct b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acct span{font-size:12.5px;color:var(--muted)}
.acct.recv{cursor:default;background:var(--sunk)}
.acct.hero{background:var(--accent-soft);border-color:var(--accent)}
.acct.hero b{color:var(--accent);font-size:26px}
.chart{display:grid;gap:8px}
.ch-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ch-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ch-body{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:180px auto;column-gap:8px}
.ch-y{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin:-6px 0}
.ch-plot{position:relative;border-bottom:1px solid var(--line)}
.ch-plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ch-cols{position:absolute;inset:0;display:flex;gap:2px}
.ch-col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1px;border-radius:3px;min-width:0}
.ch-col:hover,.ch-col.on{background:var(--sunk)}
.ch-col b{flex:1;max-width:22px;border-radius:3px 3px 0 0;min-height:0}
.ch-x{grid-column:2;display:flex;gap:2px;font-size:10.5px;color:var(--muted);padding-top:4px}
.ch-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch-plot svg path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.ch-plot svg .zero{stroke:var(--muted);stroke-width:1;opacity:.6}
.ch-col.ln{align-items:stretch}
.ch-x span{flex:1;text-align:center;white-space:nowrap;overflow:visible;min-width:0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
#tip b{display:block;margin-bottom:2px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.fn-row{display:grid;grid-template-columns:minmax(0,190px) 1fr auto;gap:10px;align-items:center;border-radius:6px;padding:2px 4px}
.fn-row:hover,.fn-row.on{background:var(--sunk)}
@media (max-width:520px){.fn-row{grid-template-columns:1fr auto}.fn-row>div{grid-column:1/-1;grid-row:2}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:4px}
.note{white-space:normal;min-width:220px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">KISO.ID <small>Back Office</small></div>
      <div class="sp"></div>
      <label class="month" for="monthSel">Periode <input type="month" id="monthSel"></label><span id="who" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></span>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="dash">Dashboard</button>
      <button role="tab" data-tab="daily">Laporan Harian</button>
      <button role="tab" data-tab="sales">Penjualan</button>
      <button role="tab" data-tab="buy">Pembelian</button>
      <button role="tab" data-tab="ap">Hutang</button>
      <button role="tab" data-tab="stock">Stok</button>
      <button role="tab" data-tab="price">Harga & Margin</button>
      <button role="tab" data-tab="cost">Beban & Aset</button>
      <button role="tab" data-tab="bank">Bank & Kas</button>
      <button role="tab" data-tab="ar">Piutang</button>
      <button role="tab" data-tab="ads">Iklan & Analitik</button>
      <button role="tab" data-tab="report">Laporan</button>
      <button role="tab" data-tab="set">Pengaturan</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<dialog id="dlg"><form id="dform" method="dialog"></form></dialog>
<dialog id="impdlg"><div id="impbox" style="display:grid;gap:14px;padding:18px"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
const MP=["Shopee","TikTok Shop"];
const CHANNELS=[...MP,"Offline","Lainnya"];
const ORDER_ST={baru:["Baru","acc"],dikirim:["Dikirim","warn"],selesai:["Selesai","good"],batal:["Batal","bad"],gagal:["Batal setelah dikirim","bad"],pending:["Belum dibayar","warn"]};
/* goods physically left the warehouse: sold orders plus orders cancelled after the courier picked them up */
const leftStock=o=>counts(o)||o.status==="gagal";
const counts=o=>o.status!=="batal"&&o.status!=="pending";
const BUY_ST={dipesan:["Dipesan","warn"],diterima:["Diterima","good"],batal:["Batal","bad"]};
const ASSET="Aset tetap";
const OUT_CAT=["Gaji","Listrik","Internet / WiFi","Sewa","Air","Transport & bensin","ATK & perlengkapan","Konsumsi","Ongkir di luar marketplace","Iklan Shopee","Iklan TikTok","Affiliate","Biaya bank & admin","Lain-lain",ASSET,"Prive / ambil pemilik"];
const IN_CAT=["Pendapatan lain","Bunga bank","Modal masuk"];
const NON_PL=["Modal masuk","Prive / ambil pemilik"];
const EXCL=[...NON_PL,ASSET];
const ADS=["Iklan Shopee","Iklan TikTok"];
const SRET_T={refund:"Uang dikembalikan ke rekening",potong:"Memotong tagihan / hutang ke supplier",ganti:"Diganti barang baru (tanpa uang)"};
const ADJ_T={masuk:"Tambah",keluar:"Kurang",opname:"Koreksi opname (+/−)"};
const ROLE={karton:"Karton sabun",piece:"Piece sabun lepas",mailer:"Bubble mailer",lain:"Bahan lain"};
const NOSTOCK=m=>m.role==="box";
const ADS_ACC="saldo-iklan-tiktok",ADS_SP_ACC="saldo-iklan-shopee";
/* Shopee ad reports are period totals; overlapping uploads (1–14 then 1–31) must not be counted twice, so a longer/later report replaces the shorter one it overlaps */
function shopeeAdsSet(){
  const rs=S.adsreports.filter(r=>r.kind==="shopeeads").map(r=>({...r,spend:(r.rows||[]).reduce((a,x)=>a+(+x.spend||0),0),len:mdays(r.from,r.to)})).sort((a,b)=>a.from.localeCompare(b.from)||b.len-a.len),out=[];
  for(const r of rs)if(!out.some(o=>o.from<=r.to&&r.from<=o.to))out.push(r);return out;
}
const mdays=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5)+1;
/* ad spend of a period report attributed to a month in proportion to the days that fall in it */
function shopeeAdSpend(m){const a=m+"-01",b=endOf(m);let t=0;for(const r of shopeeAdsSet()){const f=r.from>a?r.from:a,e=r.to<b?r.to:b;if(f<=e)t+=r.spend*mdays(f,e)/r.len;}return t;}
const COLLS=["products","materials","production","orders","purchases","cash","moves","accounts","transfers","receipts","recurring","orderdays","settles","adsdaily","adsreports","returns","supreturns","suppliers","appay","apopen"];

const S={settings:{storeName:"KISO.ID"},loaded:{},db:null,canWrite:true,team:[],teamreq:[]};
COLLS.forEach(c=>S[c]=[]);
let tab="dash",dailyCh="Semua",salesFilter="Semua",bankAcc=null,salesLimit=300,adsCh="Ringkasan";
try{tab=localStorage.getItem("kiso.tab")||"dash";}catch(e){}
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const monthSel=document.getElementById("monthSel");
/* ---------- access: who sees which module. The owner manages roles; view-only sharing = Pemilik.
   Write protection for view-only accounts is enforced by claude.ai; module hiding for editors is a display rule. ---------- */
const ROLES={
  ceo:{name:"CEO",tabs:"*",write:true,desc:"Melihat dan mengubah semua modul"},
  admin:{name:"Admin keuangan",tabs:["dash","daily","sales","buy","ap","price","cost","bank","ar","ads","report"],write:true,desc:"Melihat dan mengubah modul keuangan: Dashboard, Laporan Harian, Penjualan, Pembelian, Hutang, Harga & Margin, Beban & Aset, Bank & Kas, Piutang, Iklan, Laporan"},
  gudang:{name:"Gudang",tabs:["stock"],write:true,desc:"Hanya modul Stok (melihat dan mengubah)"},
  pemilik:{name:"Pemilik",tabs:"*",write:false,desc:"Melihat semua modul, tidak bisa mengubah apa pun"},
};
const TAB_NAME=Object.fromEntries([...document.querySelectorAll("#tabs button")].map(b=>[b.dataset.tab,b.textContent]));
const ME={ready:false,owner:false,id:null,role:null,canLvl:true,req:null,u:null};
const canTab=t=>ME.owner||!!ME.role&&(ROLES[ME.role].tabs==="*"||ROLES[ME.role].tabs.includes(t));
let PROF={};const profWant=new Set();
function wantProfiles(ids){const miss=ids.filter(i=>i&&!PROF[i]&&!profWant.has(i));if(!miss.length||!ME.u)return;miss.forEach(i=>profWant.add(i));ME.u.profiles(miss).then(r=>{Object.assign(PROF,r);render();});}
monthSel.value=today().slice(0,7);
const M=()=>monthSel.value;
const lastDay=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const endOf=m=>`${m}-${String(lastDay(m)).padStart(2,"0")}`;
const defDate=()=>today().slice(0,7)===M()?today():endOf(M());
const mdiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));

/* rupiah with sen: shows ",xx" only when the amount has cents, e.g. Rp1.250.000,50 */
const rp=n=>{const v=Math.round(Math.abs(n||0)*100)/100;return(n<-0.004?"−":"")+"Rp"+v.toLocaleString("id-ID",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});};
const num=n=>Math.round(n||0).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=s=>{if(!s)return"–";const[y,m,d]=s.split("-");return`${d}/${m}/${y.slice(2)}`;};
const mname=m=>new Date(m+"-01T00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"});
const mshort=m=>new Date(m+"-01T00:00").toLocaleDateString("id-ID",{month:"short",year:"numeric"});
const inMonth=r=>(r.date||"").slice(0,7)===M();
const byId=(list,id)=>S[list].find(r=>r.id===id);

/* ---------- orders: manual + imported (stored per day to stay under the document cap) ---------- */
let DER=null;
function derive(){
  if(DER)return DER;
  const settle=new Map(),unknown=[],adj=[];
  for(const d of S.settles){for(const r of d.rows||[])settle.set(r.i,{settle:+r.st||0,fee:+r.f||0,ads:+r.a||0,comp:r.c||null,fa:+r.fa||0,date:d.date,od:r.od,ch:d.ch,acc:d.account});for(const a of d.adj||[])adj.push({...a,date:d.date,ch:d.ch,acc:d.account});}
  const imp=[];
  for(const d of S.orderdays)for(const e of d.orders||[])imp.push({id:"x"+e.i,ref:e.i,date:d.date,time:e.t||"",channel:d.ch,status:e.s,imported:true,src:e.c||"",creator:e.cr||"",prov:e.pv||"",pay:e.py||"",items:(e.it||[]).map(([pid,qty,gross,hpp])=>({productId:pid,qty:+qty||0,price:(+qty?(+gross||0)/(+qty):0),hpp:+hpp||0}))});
  const known=new Set(imp.map(o=>o.ref));
  for(const [i,v] of settle)if(!known.has(i))unknown.push({i,...v});
  const rate={};
  for(const ch of MP){let g=0,f=0;for(const o of imp)if(o.channel===ch&&counts(o)){const st=settle.get(o.ref);if(!st)continue;const gr=o.items.reduce((a,it)=>a+it.qty*it.price,0);if(gr>0&&Math.abs(gr-st.fee-st.settle)<1){g+=gr;f+=st.fee;}}rate[ch]=g>0?f/g:0.2;}
  DER={all:[...S.orders,...imp],settle,unknown,adj,rate};
  return DER;
}
const ORD=()=>derive().all;

/* ---------- stock ---------- */
function stockOf(asOf){
  const ok=r=>!asOf||(r.date||"")<=asOf;
  const P={},Mt={},lastCost={};
  for(const p of S.products)P[p.id]=p.stocked?(+p.stockStart||0):0;
  for(const m of S.materials)Mt[m.id]=+m.stockStart||0;
  const K=roleId("karton"),PC=roleId("piece"),ML=roleId("mailer");
  const perK=+byId("materials",K)?.perUnit||180;
  const add=(id,q)=>{if(id)Mt[id]=(Mt[id]||0)+q;};
  for(const b of [...S.purchases].sort((a,b)=>(a.date||"").localeCompare(b.date||"")))if(b.status==="diterima"&&ok(b))for(const it of b.items||[]){add(it.materialId,+it.qty||0);lastCost[it.materialId]=+it.cost||0;}
  for(const x of S.production)if(ok(x)){
    const q=+x.qty||0;
    if(x.type==="buka"){add(K,-q);add(PC,q*(+x.perUnit||perK));}
    else{const p=byId("products",x.productId);P[x.productId]=(P[x.productId]||0)+q;add(PC,-q*(+p?.pcs||0));add(ML,-q);}
  }
  for(const o of ORD())if(leftStock(o)&&ok(o))for(const it of o.items||[]){
    const p=byId("products",it.productId),q=+it.qty||0;
    if(p?.stocked)P[p.id]=(P[p.id]||0)-q;else add(PC,-q*(+p?.pcs||0));
  }
  for(const m of S.moves)if(ok(m)){
    const q=+m.qty||0,d=m.type==="keluar"?-q:q,[t,id]=(m.target||"").split(":");
    if(t==="p")P[id]=(P[id]||0)+d;else if(t==="m")add(id,d);
  }
  /* customer returns: good items go back as a ready pack (isi 1–4) or as loose pieces; damaged items are only recorded */
  for(const r of S.returns)if(ok(r)&&r.cond==="baik"){const p=byId("products",r.productId),q=+r.qty||0;if(!p)continue;
    if(p.stocked&&r.as==="pack")P[p.id]=(P[p.id]||0)+q;else add(PC,q*(+p.pcs||0));}
  /* returns to supplier leave the warehouse */
  for(const r of S.supreturns)if(ok(r))for(const it of r.items||[])add(it.materialId,-(+it.qty||0));
  const packs=S.products.filter(p=>p.stocked).reduce((a,p)=>a+(P[p.id]||0)*(+p.pcs||0),0);
  const soap=(K?(Mt[K]||0)*perK:0)+(PC?(Mt[PC]||0):0)+packs;
  return{P,Mt,lastCost,K,PC,ML,perK,packs,soap};
}
function unitCost(m,s){
  if(s.lastCost[m.id]!=null)return s.lastCost[m.id];
  if(+m.cost)return +m.cost;
  if(m.role==="piece"&&s.K){const k=byId("materials",s.K);const kc=s.lastCost[s.K]??+k?.cost??0;return kc/(s.perK||180);}
  return 0;
}
function inventoryValue(s){
  let v=0;
  for(const m of S.materials)if(!NOSTOCK(m))v+=Math.max(0,s.Mt[m.id]||0)*unitCost(m,s);
  /* every loose or cartoned soap already carries its box */
  v+=Math.max(0,s.soap-s.packs)*boxCost(s);
  for(const p of S.products)if(p.stocked)v+=Math.max(0,s.P[p.id]||0)*(+p.hpp||0);
  return v;
}
function boxCost(s){const b=S.materials.find(m=>m.role==="box");return b?unitCost(b,s):0;}
function suggestHpp(p,s){
  const pc=byId("materials",s.PC),ml=byId("materials",s.ML);
  const piece=pc?unitCost(pc,s):0,mail=ml?unitCost(ml,s):0;
  return(+p.pcs||0)*(piece+boxCost(s))+(p.stocked?mail:0);
}
function lowItems(s){
  const out=[];
  for(const p of S.products)if(p.stocked&&p.active!==false&&(s.P[p.id]||0)<=(+p.stockMin||0))out.push({name:p.name,left:s.P[p.id]||0,min:+p.stockMin||0,unit:"pack"});
  for(const m of S.materials)if(!NOSTOCK(m)&&(s.Mt[m.id]||0)<=(+m.stockMin||0))out.push({name:m.name,left:s.Mt[m.id]||0,min:+m.stockMin||0,unit:m.unit||"pcs"});
  return out;
}

/* ---------- money ---------- */
/* an order saved before its product had an HPP falls back to the product's current HPP */
const hppOf=id=>+byId("products",id)?.hpp||0;
function orderTotals(o){
  let gross=0,hpp=0,qty=0;for(const it of o.items||[]){gross+=(+it.qty||0)*(+it.price||0);hpp+=(+it.qty||0)*(+it.hpp||hppOf(it.productId));qty+=+it.qty||0;}
  if(o.imported){const D=derive(),st=D.settle.get(o.ref);
    if(st)return{gross,hpp,qty,fee:st.fee-st.ads,refund:gross-st.fee-st.settle,net:st.settle+st.ads,est:false,settled:true,sdate:st.date,fa:st.fa,comp:st.comp,ads:st.ads};
    if(o.status==="gagal")return{gross,hpp,qty,fee:0,refund:gross,net:0,est:false,settled:false};/* failed delivery: the platform will not pay, so no receivable */
    const fee=Math.round(gross*(D.rate[o.channel]??0.2));return{gross,hpp,qty,fee,refund:0,net:gross-fee,est:true,settled:false};}
  return{gross,hpp,qty,fee:+o.fee||0,refund:0,net:gross-(+o.fee||0),est:false};
}
const sretTotal=r=>(r.items||[]).reduce((a,it)=>a+(+it.qty||0)*(+it.cost||0),0);
const skey=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
const supName=n=>{const k=skey(n),s=S.suppliers.find(x=>skey(x.name)===k);return s?s.name:String(n||"").trim();};
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+(+n||0));return x.toISOString().slice(0,10);};
/* open supplier invoices as of a date: received, not paid at purchase; payments tied to an invoice settle it,
   supplier-level payments and returns deducted from the bill settle the oldest invoices first */
function apState(asOf="9999-12-31"){
  const sup={},get=n=>sup[skey(n)]||={name:supName(n),inv:[],credit:0,paidNow:0};
  for(const b of S.purchases)if(b.status==="diterima"&&!b.paid&&(b.date||"")<=asOf){const s=get(b.supplier);s.inv.push({id:b.id,date:b.date,due:b.due||b.date,total:buyTotal(b),paid:0,b});}
  for(const o of S.apopen)if((o.date||"")<=asOf){const s=get(o.supplier);s.inv.push({id:o.id,date:o.date,due:o.due||o.date,total:+o.amount||0,paid:0,b:{items:[]},opening:true,ref:o.ref,note:o.note});}
  for(const p of S.appay)if((p.date||"")<=asOf){const s=get(p.supplier);const iv=p.purchaseId&&s.inv.find(i=>i.id===p.purchaseId);if(iv)iv.paid+=+p.amount||0;else s.credit+=+p.amount||0;s.paidNow+=+p.amount||0;}
  for(const r of S.supreturns)if(r.settle==="potong"&&(r.date||"")<=asOf)get(r.supplier).credit+=sretTotal(r);
  for(const s of Object.values(sup)){s.inv.sort((a,b)=>a.date.localeCompare(b.date));let c=s.credit;
    for(const i of s.inv){let left=i.total-i.paid;if(left<0){c+=-left;left=0;}const take=Math.min(c,left);i.paid+=take;c-=take;i.left=left-take;}
    s.extra=c;s.left=s.inv.reduce((a,i)=>a+i.left,0);s.open=s.inv.filter(i=>i.left>=0.5);}
  return sup;
}
const apTotal=asOf=>Object.values(apState(asOf)).reduce((a,s)=>a+s.left,0);
const buyTotal=b=>(b.items||[]).reduce((a,it)=>a+(+it.qty||0)*(+it.cost||0),0)+(+b.extra||0);

function ledger(){
  const L=[];
  for(const c of S.cash)L.push({date:c.date,acc:c.account,amt:c.type==="keluar"?-(+c.amount||0):+c.amount||0,desc:`${c.category}${c.note?" · "+c.note:""}`,kind:"cash",cat:c.category,id:c.id});
  for(const t of S.transfers){L.push({date:t.date,acc:t.from,amt:-(+t.amount||0),desc:`Transfer ke ${aname(t.to)}${t.note?" · "+t.note:""}`,kind:"transfer",id:t.id});L.push({date:t.date,acc:t.to,amt:+t.amount||0,desc:`Transfer dari ${aname(t.from)}${t.note?" · "+t.note:""}`,kind:"transfer",id:t.id});}
  for(const r of S.receipts)if(r.type==="pencairan")L.push({date:r.date,acc:r.account,amt:+r.amount||0,desc:`Pencairan ${r.channel} · pesanan ${mshort(r.period)}${r.note?" · "+r.note:""}`,kind:"receipt",id:r.id});
  for(const o of S.orders)if(!MP.includes(o.channel)&&counts(o)&&o.account)L.push({date:o.date,acc:o.account,amt:orderTotals(o).net,desc:`Penjualan ${o.channel}${o.ref?" · "+o.ref:""}`,kind:"order",id:o.id});
  for(const p of S.appay)L.push({date:p.date,acc:p.account,amt:-(+p.amount||0),desc:`Bayar hutang ${supName(p.supplier)}${p.note?" · "+p.note:""}`,kind:"appay",id:p.id});
  for(const r of S.supreturns)if(r.settle==="refund"&&r.account)L.push({date:r.date,acc:r.account,amt:sretTotal(r),desc:`Refund retur ke supplier ${r.supplier||""}`,kind:"sret",id:r.id});
  for(const b of S.purchases)if(b.paid&&b.status!=="batal"&&b.payAccount)L.push({date:b.payDate||b.date,acc:b.payAccount,amt:-buyTotal(b),desc:`Bayar supplier ${b.supplier||""}`,kind:"buy",id:b.id});
  for(const d of S.settles){const sum=(d.rows||[]).reduce((a,r)=>a+(+r.st||0),0),n=(d.rows||[]).filter(r=>+r.st).length;
    if(sum)L.push({date:d.date,acc:d.account,amt:sum,desc:`Penyelesaian ${n} pesanan ${d.ch}`,kind:"settle",id:d.id});
    const ga=(d.rows||[]).reduce((a,r)=>a+(+r.a||0),0);if(ga)L.push({date:d.date,acc:d.ch===SP?ADS_SP_ACC:ADS_ACC,amt:ga,desc:d.ch===SP?"Top-up saldo iklan otomatis dari penghasilan Shopee":`Biaya iklan GMV Max dipotong dari pencairan ${d.ch}`,kind:"settle",id:d.id});
    for(const a of d.adj||[]){L.push({date:d.date,acc:d.account,amt:+a.amt||0,desc:`${a.type} (${d.ch})`,kind:"settle",id:d.id});
      if(/iklan/i.test(a.type))L.push({date:d.date,acc:ADS_ACC,amt:-(+a.amt||0),desc:`Pembayaran iklan dari saldo ${d.ch}`,kind:"settle",id:d.id});}}
  for(const r of shopeeAdsSet())if(r.spend)L.push({date:r.to,acc:ADS_SP_ACC,amt:-r.spend,desc:`Pemakaian iklan Shopee ${fdate(r.from)}–${fdate(r.to)}`,kind:"ads",cat:"Iklan Shopee",id:r.id});
  for(const d of S.adsdaily)if(+d.spend)L.push({date:d.date,acc:ADS_ACC,amt:-d.spend,desc:`Pemakaian iklan ${d.ch||"TikTok"}`,kind:"ads",cat:"Iklan TikTok",id:d.id});
  return L.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
function balances(asOf){const bal={};for(const a of S.accounts)bal[a.id]=+a.opening||0;for(const l of ledger())if(!asOf||l.date<=asOf)bal[l.acc]=(bal[l.acc]||0)+l.amt;return bal;}
function receivables(asOf){
  const R={},key=(ch,m)=>{R[ch]??={};return R[ch][m]??={orders:0,net:0,paid:0,adj:0};};
  const D=derive();
  for(const o of ORD())if(MP.includes(o.channel)&&counts(o)&&(o.date||"")<=asOf){const r=key(o.channel,o.date.slice(0,7)),t=orderTotals(o);r.orders++;r.net+=t.net;if(t.settled&&t.sdate<=asOf)r.paid+=t.net;}
  const op=S.settings.arOpening||{};
  for(const ch of MP)if(+op[ch])key(ch,"awal").net+=+op[ch];
  for(const u of D.unknown)if(u.date<=asOf&&u.settle)key(u.ch,"awal").paid+=u.settle;
  for(const x of S.receipts)if(x.type==="penyesuaian"?(x.period||"")<=asOf.slice(0,7):(x.date||"")<=asOf){const r=key(x.channel,x.period);if(x.type==="pencairan")r.paid+=+x.amount||0;else r.adj+=+x.amount||0;}
  for(const ch in R)for(const m in R[ch]){const r=R[ch][m];r.left=r.net-r.paid-r.adj;}
  return R;
}
const recvTotal=(R,ch)=>Object.values(R[ch]||{}).reduce((a,r)=>a+r.left,0);
/* fixed assets: straight-line from the purchase month */
function assetsAt(m){
  return S.cash.filter(c=>c.type==="keluar"&&c.category===ASSET&&(c.date||"").slice(0,7)<=m).map(c=>{
    const life=Math.max(1,+c.life||48),cost=+c.amount||0,per=cost/life,age=mdiff(c.date.slice(0,7),m);
    const n=Math.min(life,age+1);return{...c,life,cost,per,acc:per*n,book:cost-per*n,dep:age<life?per:0};
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
/* ch = one sales channel: only what belongs to it (its orders, fees, marketplace adjustments, its own ads); shared costs stay in the total */
function monthPL(m=M(),ch=null){
  const im=r=>(r.date||"").slice(0,7)===m;
  const orders=ORD().filter(o=>im(o)&&counts(o)&&(!ch||o.channel===ch));
  let gross=0,fee=0,hpp=0,units=0,refund=0,est=0;const perProd={},perDay={},perCh={},perDayDet={};
  const feeBy={};const addFee=(k,v)=>{if(v)feeBy[k]=(feeBy[k]||0)+v;};
  for(const o of orders){const t=orderTotals(o);gross+=t.gross;fee+=t.fee;refund+=t.refund||0;if(t.est)est+=t.fee;hpp+=t.hpp;units+=t.qty;
    if(t.comp){let cs=0;for(const [k,v] of Object.entries(t.comp)){if(/GMV Max|Isi Saldo Otomatis/i.test(k))continue;addFee(feeGroup(k),v);cs+=v;}addFee("Biaya lain (selisih rincian)",t.fee-cs);}
    else if(t.settled)addFee(`Potongan ${o.channel} (tanpa rincian)`,t.fee);
    else if(t.est)addFee("Estimasi potongan pesanan belum cair",t.fee);
    else addFee(`Potongan diisi manual (${o.channel})`,t.fee);
    const d=+o.date.slice(8,10);perDay[d]=(perDay[d]||0)+t.gross;perCh[o.channel]=(perCh[o.channel]||0)+t.gross;const pd=perDayDet[d]||={n:0,ch:{}};pd.n++;pd.ch[o.channel]=(pd.ch[o.channel]||0)+t.gross;
    for(const it of o.items||[]){const g=(+it.qty||0)*(+it.price||0),share=t.gross?t.fee*g/t.gross:0;const r=perProd[it.productId]||={qty:0,rev:0,hpp:0,fee:0};r.qty+=+it.qty||0;r.rev+=g;r.hpp+=(+it.qty||0)*(+it.hpp||hppOf(it.productId));r.fee+=share+(t.gross?(t.refund||0)*g/t.gross:0);}}
  const adj=S.receipts.filter(x=>x.type==="penyesuaian"&&x.period===m&&(!ch||x.channel===ch)).reduce((a,x)=>a+(+x.amount||0),0);
  const outBy={};let otherIn=0;
  const incomeBy={},addInc=(k,v)=>{if(v)incomeBy[k]=(incomeBy[k]||0)+v;};
  if(!ch)for(const c of S.cash.filter(im)){if(EXCL.includes(c.category))continue;if(c.type==="keluar")outBy[c.category]=(outBy[c.category]||0)+(+c.amount||0);else addInc(c.category,+c.amount||0);}
  for(const a of derive().adj)if((a.date||"").slice(0,7)===m&&(!ch||a.ch===ch)){const v=+a.amt||0;if(/iklan/i.test(a.type))continue;if(v>0)addInc(`${a.type} (${a.ch})`,v);else outBy["Penyesuaian marketplace"]=(outBy["Penyesuaian marketplace"]||0)-v;}
  const adsUse=!ch||ch===TT?S.adsdaily.filter(im).reduce((a,d)=>a+(+d.spend||0),0):0;if(adsUse)outBy["Iklan TikTok"]=(outBy["Iklan TikTok"]||0)+adsUse;
  const spAds=!ch||ch===SP?shopeeAdSpend(m):0;if(spAds)outBy["Iklan Shopee"]=(outBy["Iklan Shopee"]||0)+spAds;
  const ads=ADS.reduce((a,k)=>a+(outBy[k]||0),0),aff=outBy["Affiliate"]||0;
  const opexBy=Object.fromEntries(Object.entries(outBy).filter(([k])=>!ADS.includes(k)&&k!=="Affiliate"));
  const opex=Object.values(opexBy).reduce((a,v)=>a+v,0);
  const dep=ch?0:assetsAt(m).reduce((a,x)=>a+x.dep,0);
  for(const [k,v] of Object.entries(feeBy))if(v<=-0.5){addInc(k,-v);fee-=v;delete feeBy[k];}
  otherIn=Object.values(incomeBy).reduce((a,v)=>a+v,0);
  const netSales=gross-fee-refund-adj,grossProfit=netSales-hpp,net=grossProfit-ads-aff-opex-dep+otherIn;
  return{gross,fee,feeBy,refund,est,adj,hpp,netSales,grossProfit,ads,aff,opex,opexBy,dep,income:otherIn,incomeBy,net,count:orders.length,units,perProd,perDay,perCh,perDayDet};
}

/* ---------- shared bits ---------- */
function feeGroup(k){
  if(/^Komisi dinamis/i.test(k))return"Komisi dinamis";
  if(/^Biaya komisi platform/i.test(k))return"Biaya komisi platform";
  if(/afiliasi|AMS/i.test(k))return"Komisi affiliate";
  if(/^(Ongkir Dibayar Pembeli|Ongkos Kirim yang Dibayarkan ke Jasa Kirim|Potongan Ongkos Kirim dari Jasa Kirim|Gratis Ongkir dari Shopee|Ongkos Kirim Pengembalian Barang|Return to Seller Fee|Pengembalian Biaya Kirim)/i.test(k))return"Ongkir bersih ditanggung penjual (Shopee)";
  if(/^Voucher (co-fund )?disponsor oleh Penjual/i.test(k))return"Voucher ditanggung penjual (Shopee)";
  if(/^Cashback Koin/i.test(k))return"Cashback koin ditanggung penjual (Shopee)";
  if(/^Biaya Administrasi/i.test(k))return"Biaya administrasi (Shopee)";
  if(/^Biaya Proses Pesanan/i.test(k))return"Biaya pemrosesan pesanan";
  if(/^Biaya Gratis Ongkir XTRA/i.test(k))return"Biaya Gratis Ongkir XTRA (Shopee)";
  if(/^Biaya Kampanye/i.test(k))return"Biaya kampanye (Shopee)";
  if(/^Ongkir$/i.test(k))return"Ongkir bersih ditanggung penjual (TikTok, termasuk biaya layanan logistik)";
  if(/Growth Xtra/i.test(k))return"Biaya layanan Program Growth Xtra";
  if(/pemrosesan pesanan/i.test(k))return"Biaya pemrosesan pesanan";
  if(/PPh/i.test(k))return"PPh Pasal 22 dipungut";
  if(/PayLater/i.test(k))return"Biaya program PayLater";
  return k;
}

  return`<div class="pl pl3">

function plCompare(m=M()){
  const used=new Set(ORD().filter(o=>(o.date||"").slice(0,7)===m&&counts(o)).map(o=>o.channel));
  const chans=[...MP,...CHANNELS.filter(c=>!MP.includes(c)&&used.has(c))],P=chans.map(c=>monthPL(m,c)),T=monthPL(m);
  const sum=f=>P.reduce((a,p)=>a+f(p),0),G=[...P.map(p=>p.gross),sum(p=>p.gross)];
  const cell=(v,i,neg,cls="")=>{const g=G[i],x=neg?-v:v;return`<td class="n ${cls} ${x<0?"neg":""}">${Math.abs(v)<0.5?'<span class="mut">–</span>':rp(Math.round(x))}<small>${g&&Math.abs(v)>=0.5?pct(Math.abs(v),g):""}</small></td>`;};
  const line=(label,f,{neg,cls="",sub}={})=>{const vs=[...P.map(f),sum(f)];if(sub&&vs.every(v=>Math.abs(v)<0.5))return"";return`<tr class="${cls}"><td class="${sub?"pc-sub":""}">${label}</td>${vs.map((v,i)=>cell(v,i,neg,i===vs.length-1?"pc-tot":"")).join("")}</tr>`;};
  const only=(label,v,neg,cls="")=>Math.abs(v)<0.5&&!cls?"":`<tr class="${cls}"><td>${label}</td>${chans.map(()=>'<td class="n mut">·</td>').join("")}${cell(v,chans.length,neg,"pc-tot")}</tr>`;
  const fk=[...new Set(P.flatMap(p=>Object.keys(p.feeBy)))].sort((a,b)=>sum(p=>p.feeBy[b]||0)-sum(p=>p.feeBy[a]||0));
  const ik=[...new Set(P.flatMap(p=>Object.keys(p.incomeBy)))];
  const contrib=p=>p.net;/* a channel P&L has no shared costs, so its net = contribution after own ads */
  const shared=T.income-sum(p=>p.income),net=sum(contrib)-T.aff-T.opex-T.dep+shared;
  const exp=p=>p.count?`${num(p.count)} pesanan · ${num(p.units)} pcs`:"";
  return`<div class="tbl"><table class="pc"><thead><tr><th></th>${chans.map((c,i)=>`<th class="n">${esc(c)}<small>${exp(P[i])}</small></th>`).join("")}<th class="n pc-tot">Total<small>${exp(T)}</small></th></tr></thead><tbody>
  ${line("Penjualan kotor",p=>p.gross,{cls:"pc-t"})}
  ${line("Potongan marketplace",p=>p.fee,{neg:1})}
  ${fk.map(k=>line(esc(k),p=>p.feeBy[k]||0,{neg:1,sub:1})).join("")}
  ${line("Retur & pengembalian dana",p=>p.refund,{neg:1,sub:0})}
  ${sum(p=>p.adj)?line("Selisih pencairan marketplace",p=>p.adj,{neg:1}):""}
  ${line("Penjualan bersih",p=>p.netSales,{cls:"pc-t"})}
  ${line("HPP",p=>p.hpp,{neg:1})}
  ${line("Laba kotor",p=>p.grossProfit,{cls:"pc-t"})}
  ${line("Iklan",p=>p.ads,{neg:1})}
  ${ik.map(k=>line(esc(k),p=>p.incomeBy[k]||0,{sub:1})).join("")}
  ${line("Kontribusi channel",contrib,{cls:"pc-t pc-k"})}
  ${only("Affiliate (dibayar terpisah)",T.aff,1)}
  ${only("Beban operasional",T.opex,1)}
  ${only("Penyusutan aset tetap",T.dep,1)}
  ${only("Pendapatan lain (di luar marketplace)",shared,0)}
  ${only("Laba bersih",net,0,"pc-t pc-k")}
  </tbody></table></div>
  <p class="hint">Persentase kecil di bawah angka = porsi dari penjualan kotor channel itu. <b>Kontribusi channel</b> = laba kotor − iklan channel itu (+ pendapatan marketplace channel itu), yaitu sumbangan tiap marketplace untuk menutup beban bersama. Beban operasional, affiliate yang dibayar terpisah, dan penyusutan tidak dibagi ke channel, jadi hanya muncul di kolom Total. Iklan TikTok = pemakaian harian; iklan Shopee = laporan iklan Shopee dibagi rata per hari.</p>`;
}

function payPill(b,AP){
  if(b.paid)return`<span class="pill good">Lunas · ${esc(aname(b.payAccount))}</span>`;
  if(b.status!=="diterima")return'<span class="pill">Tempo · belum diterima</span>';
  const iv=AP[skey(b.supplier)]?.inv.find(i=>i.id===b.id);if(!iv)return'<span class="pill warn">Hutang</span>';
  if(iv.left<0.5)return'<span class="pill good">Hutang lunas</span>';
  const od=iv.due<today();return`<span class="pill ${od?"bad":"warn"}">Sisa ${rp(iv.left)}${iv.due?` · ${od?"lewat":"jt"} ${fdate(iv.due)}`:""}</span>`;
}

  ${prods.length?`<div class="tbl"><table><thead><tr><th>SKU</th><th>Produk</th><th class="n">Isi</th><th class="n">HPP bahan</th><th class="n">HPP dipakai</th><th class="n">Harga jual</th><th class="n">Margin / unit</th><th class="n">Margin %</th><th class="n">Margin ${esc(mshort(M()))}</th></tr></thead><tbody>

  </tbody></table></div>
  <p class="hint">HPP bahan = isi × (harga per piece + box packaging) + bubble mailer untuk isi 1–4. Harga per piece = harga karton ÷ ${num(s.perK)}, dari harga beli terakhir. Margin bulanan sudah dikurangi potongan marketplace, belum dikurangi iklan. Klik baris untuk mengubah HPP atau harga jual.</p>`

  <div class="panel"><h3>Harga bahan & nilai persediaan</h3>
  ${mats.length?`<div class="tbl"><table><thead><tr><th>Bahan</th><th class="n">Stok</th><th class="n">Harga / unit</th><th>Sumber harga</th><th class="n">Nilai</th></tr></thead><tbody>
  ${mats.map(m=>{const q=s.Mt[m.id]||0,uc=unitCost(m,s),src=s.lastCost[m.id]!=null?"Pembelian terakhir":+m.cost?"Diisi manual":m.role==="piece"?"Harga karton ÷ "+num(s.perK):"Belum ada";

    return`<tr class="click" data-edit="matcost" data-id="${m.id}"><td>${esc(m.name)}</td><td class="n">${num(q)} ${esc(m.unit||"pcs")}</td><td class="n">${uc?rp(uc):"–"}</td><td class="mut">${src}</td><td class="n">${rp(Math.max(0,q)*uc)}</td></tr>`}).join("")}
  <tr><td>Pack siap kirim isi 1–4</td><td class="n">${num(S.products.filter(p=>p.stocked).reduce((a,p)=>a+(s.P[p.id]||0),0))} pack</td><td class="n mut">HPP</td><td class="mut">HPP dipakai</td><td class="n">${rp(S.products.filter(p=>p.stocked).reduce((a,p)=>a+Math.max(0,s.P[p.id]||0)*(+p.hpp||0),0))}</td></tr>

V.cost=()=>{

  const done=id=>mc.filter(c=>c.recurringId===id);
  const recRows=rec.filter(r=>r.active!==false).map(r=>{const d=done(r.id),paid=d.reduce((a,c)=>a+(+c.amount||0),0);
    return`<tr><td class="click" data-edit="recurring" data-id="${r.id}" style="cursor:pointer"><b>${esc(r.name)}</b><div class="hint">${esc(r.category)} · dari ${esc(aname(r.account))}</div></td><td class="n">${+r.amount?rp(+r.amount):'<span class="pill bad">Isi nominal</span>'}</td>
    <td>${d.length?`<span class="pill good">Tercatat ${fdate(d[0].date)}</span>`:'<span class="pill warn">Belum</span>'}</td><td class="n">${d.length?rp(paid):"–"}</td>
    <td class="n">${S.canWrite&&!d.length?`<button class="btn sm pri" data-pay="${r.id}">Catat bayar</button>`:""}</td></tr>`}).join("");

   <div class="panel"><div class="row"><h3>Beban rutin bulanan</h3><div class="sp"></div><span class="hint">Tercatat ${rp(recPaid)} dari anggaran ${rp(recTot)}</span></div>
    ${rec.length?`<div class="tbl"><table><thead><tr><th>Beban</th><th class="n">Anggaran</th><th>Status</th><th class="n">Dibayar</th><th></th></tr></thead><tbody>${recRows}</tbody></table></div>
    <p class="hint">Klik "Catat bayar" setiap bulan. Nominal bisa diubah saat mencatat. Klik nama beban untuk mengubah anggaran atau rekening sumbernya.</p>`
    :`<div class="empty"><b>Belum ada beban rutin</b>Tambahkan gaji, listrik, WiFi, sewa, dan beban tetap lain.</div>`}
   </div>
   <div class="panel"><h3>Per kategori</h3>
    ${Object.keys(byCat).length||at.dep?`<div class="pl">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${esc(k)}</span><span>${rp(v)}</span></div>`).join("")}${at.dep?`<div><span>Penyusutan aset tetap</span><span>${rp(at.dep)}</span></div>`:""}<div class="big"><span>Total beban</span><span>${rp(tot+at.dep)}</span></div></div>`:`<div class="empty">Belum ada beban tercatat.</div>`}
   </div>
  </div>
  <div class="panel"><h3>Semua beban · harian</h3>
   ${daily.length?`<div class="tbl"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Dibayar dari</th><th class="n">Jumlah</th></tr></thead><tbody>${daily.map(c=>`<tr class="click" data-edit="cost" data-id="${c.id}"><td>${fdate(c.date)}</td><td>${esc(c.category)}${c.recurringId?' <span class="pill acc">Rutin</span>':""}</td><td class="wrapcell">${esc(c.note||"")}</td><td>${esc(aname(c.account))}</td><td class="n">${rp(+c.amount)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="4">Total</td><td class="n">${rp(tot)}</td></tr></tfoot></table></div>`

  </div>
  <div class="panel"><div class="row"><h3>Aset tetap</h3><div class="sp"></div><span class="hint">Penyusutan bulan ini ${rp(at.dep)}</span></div>
   ${assets.length?`<div class="tbl"><table><thead><tr><th>Tgl beli</th><th>Aset</th><th class="n">Harga beli</th><th class="n">Umur</th><th class="n">Susut / bln</th><th class="n">Akum. susut</th><th class="n">Nilai buku</th></tr></thead><tbody>

   </tbody><tfoot><tr><td colspan="2">Total per akhir ${esc(mname(M()))}</td><td class="n">${rp(at.cost)}</td><td></td><td class="n">${rp(at.dep)}</td><td class="n">${rp(at.acc)}</td><td class="n">${rp(at.book)}</td></tr></tfoot></table></div>`

V.bank=()=>{
  const end=endOf(M()),start=M()+"-01",bal=balances(end),accs=sortAcc();
  if(!bankAcc||!byId("accounts",bankAcc))bankAcc=accs[0]?.id||null;
  const L=ledger().filter(l=>l.acc===bankAcc);
  let run=(+byId("accounts",bankAcc)?.opening||0)+L.filter(l=>l.date<start).reduce((a,l)=>a+l.amt,0);
  const open=run;
  const rows=L.filter(l=>l.date>=start&&l.date<=end).map(l=>{run+=l.amt;return{...l,run};});
  const tin=rows.filter(r=>r.amt>0).reduce((a,r)=>a+r.amt,0),tout=rows.filter(r=>r.amt<0).reduce((a,r)=>a+r.amt,0);
  return`<div class="row"><h2>Bank & kas</h2><div class="sp"></div>${btn("account","+ Rekening")}${btn("transfer","Transfer antar rekening")}${btn("cash","+ Pemasukan / pengeluaran lain",1)}</div>
  ${accs.length?`<div class="accts">${accs.map(a=>`<button class="acct" data-acc="${a.id}" aria-pressed="${a.id===bankAcc}"><span>${esc(a.name)}</span><b class="${(bal[a.id]||0)<0?"neg":""}">${rp(bal[a.id])}</b><span>Saldo akhir ${mshort(M())}</span></button>`).join("")}</div>`:""}
  ${bankAcc?`<div class="panel"><div class="row"><h3>Mutasi ${esc(aname(bankAcc))} · ${esc(mname(M()))}</h3><div class="sp"></div>${S.canWrite?`<button class="btn sm" data-edit-acc="${bankAcc}">Ubah rekening</button>`:""}</div>
    <div class="tbl"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="n">Masuk</th><th class="n">Keluar</th><th class="n">Saldo</th></tr></thead><tbody>
    <tr><td>${fdate(start)}</td><td class="mut">Saldo awal bulan</td><td></td><td></td><td class="n">${rp(open)}</td></tr>
    ${rows.map(r=>`<tr ${r.kind==="settle"?'title="Dari impor income marketplace"':`class="click" data-edit="${r.kind==="cash"&&r.cat===ASSET?"asset":r.kind}" data-id="${r.id}"`}><td>${fdate(r.date)}</td><td class="wrapcell">${esc(r.desc)}</td><td class="n pos">${r.amt>0?rp(r.amt):""}</td><td class="n neg">${r.amt<0?rp(-r.amt):""}</td><td class="n">${rp(r.run)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="2">Total bulan ini</td><td class="n">${rp(tin)}</td><td class="n">${rp(-tout)}</td><td class="n">${rp(open+tin+tout)}</td></tr></tfoot></table></div>
    <p class="hint">Cocokkan saldo akhir dengan rekening koran / buku kas. Mutasi berasal dari beban, aset, pencairan marketplace, penjualan offline, pembayaran supplier, dan transfer.</p></div>`
  :emptyBox("Belum ada rekening","Tambahkan rekening bank dan kas kecil beserta saldo awalnya.")}`;
};

V.ar=()=>{
  const end=endOf(M()),R=receivables(end);
  const recs=S.receipts.filter(inMonth).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const sec=MP.map(ch=>{
    const months=Object.entries(R[ch]||{}).filter(([m,r])=>(m==="awal"||m<=M())&&(Math.abs(r.left)>=1||m===M()||(m==="awal"&&r.net))).sort((a,b)=>a[0]==="awal"?1:b[0]==="awal"?-1:b[0].localeCompare(a[0]));
    const tot=months.reduce((a,[,r])=>a+r.left,0);
    return`<div class="panel"><div class="row"><h3>Piutang ${ch}</h3><div class="sp"></div><span class="pill ${tot>0?"warn":"good"}">Sisa ${rp(tot)}</span></div>
    ${months.length?`<div class="tbl"><table><thead><tr><th>Pesanan bulan</th><th class="n">Pesanan</th><th class="n">Nilai bersih</th><th class="n">Sudah cair</th><th class="n">Penyesuaian</th><th class="n">Sisa piutang</th><th></th></tr></thead><tbody>
    ${months.map(([m,r])=>`<tr><td>${m==="awal"?"Saldo awal (pesanan sebelum aplikasi)":esc(mname(m))}</td><td class="n">${num(r.orders)}</td><td class="n">${rp(r.net)}</td><td class="n">${rp(r.paid)}</td><td class="n mut">${r.adj?rp(r.adj):"–"}</td><td class="n ${r.left>0?"":"pos"}"><b>${rp(r.left)}</b></td><td>${Math.abs(r.left)<1?'<span class="pill good">Lunas</span>':S.canWrite&&m!=="awal"?`<button class="btn sm" data-recv="${ch}|${m}">Catat pencairan</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Tidak ada piutang ${ch} sampai akhir ${esc(mname(M()))}.</div>`}</div>`;}).join("");

  <p class="hint">Posisi per ${fdate(end)}. Setiap pesanan Shopee / TikTok Shop (selain batal) menambah piutang sebesar nilai bersihnya di bulan pesanan. Pencairan yang dicatat untuk bulan pesanan tersebut mengurangi piutangnya, walaupun dananya baru masuk bulan berikutnya. Untuk TikTok Shop, impor file income: setiap pesanan dicocokkan dengan nomor pesanannya dan dananya masuk ke rekening Saldo TikTok Shop. Dana cair masuk ke saldo penjual TikTok (bukan langsung ke bank); saat saldo itu kamu tarik ke bank, catat sebagai transfer Saldo TikTok Shop → rekening bank.</p>
  ${sec}
  <div class="panel"><h3>Pencairan yang diterima di ${esc(mname(M()))}</h3>
  ${recs.length?`<div class="tbl"><table><thead><tr><th>Tanggal</th><th>Marketplace</th><th>Untuk pesanan</th><th>Jenis</th><th>Masuk ke</th><th>Catatan</th><th class="n">Jumlah</th></tr></thead><tbody>
  ${recs.map(x=>`<tr class="click" data-edit="receipt" data-id="${x.id}"><td>${fdate(x.date)}</td><td>${esc(x.channel)}</td><td>${esc(mname(x.period))}${x.period<M()?' <span class="pill acc">Bulan lalu</span>':""}</td><td>${x.type==="pencairan"?"Pencairan":'<span class="pill warn">Penyesuaian</span>'}</td><td>${x.type==="pencairan"?esc(aname(x.account)):"–"}</td><td class="wrapcell">${esc(x.note||"")}</td><td class="n">${rp(+x.amount)}</td></tr>`).join("")}
  </tbody></table></div>`:`<p class="hint">Belum ada pencairan dicatat bulan ini. Ambil angkanya dari laporan penghasilan / income Shopee dan TikTok Shop.</p>`}</div>`;
};

V.report=()=>{
  const pl=monthPL(),end=endOf(M()),bal=balances(end),R=receivables(end),s=stockOf(end);
  const inv=inventoryValue(s),fixed=assetsAt(M()).reduce((a,x)=>a+x.book,0);
  const ap=apTotal(end);
  const recv=MP.map(ch=>[ch,recvTotal(R,ch)]);
  const cur=Object.values(bal).reduce((a,v)=>a+v,0)+recv.reduce((a,[,v])=>a+v,0)+inv;
  return`<h2>Laporan ${esc(mname(M()))}</h2>
  <div class="grid2">
   <div class="panel"><h3>Laba rugi</h3>${plHtml(pl,true)}<p class="hint">Basis akrual: penjualan diakui di bulan pesanan, walau dananya cair bulan berikutnya. Pembelian aset, modal masuk, dan prive tidak dihitung sebagai beban atau laba. Aset masuk lewat penyusutan.</p></div>
   <div class="panel"><h3>Posisi keuangan akhir bulan</h3><div class="pl">
    <div class="sec"><span>Aset lancar</span><span></span></div>
    ${sortAcc().map(a=>`<div class="ind"><span>${esc(a.name)}</span><span>${rp(bal[a.id])}</span></div>`).join("")}
    ${recv.map(([ch,v])=>`<div class="ind"><span>Piutang ${ch}</span><span>${rp(v)}</span></div>`).join("")}
    <div class="ind"><span>Persediaan (${num(s.soap)} sabun + bahan)</span><span>${rp(inv)}</span></div>
    <div class="t"><span>Total aset lancar</span><span>${rp(cur)}</span></div>
    <div class="sec"><span>Aset tetap</span><span></span></div>
    <div class="ind"><span>Aset tetap (nilai buku)</span><span>${rp(fixed)}</span></div>
    <div class="t"><span>Total aset</span><span>${rp(cur+fixed)}</span></div>
    <div class="sec"><span>Kewajiban</span><span></span></div>
    <div class="ind"><span>Hutang supplier</span><span>${rp(ap)}</span></div>
    <div class="big"><span>Aset bersih</span><span>${rp(cur+fixed-ap)}</span></div>
   </div><p class="hint">Persediaan dihitung dari stok akhir bulan: bahan × harga beli terakhir, pack siap kirim × HPP.</p></div>
  </div>
  <div class="panel"><h3>Ringkasan arus kas ${esc(mname(M()))}</h3>${cashflow()}</div>`;
};
function cashflow(){

  if(kind==="livecampaign")out=rows.filter(r=>r["Nama kampanye"]).map(r=>({camp:r["Nama kampanye"],budget:nv(r["Anggaran saat ini"]),spend:nv(r["Biaya"]),gmv:nv(r["Pendapatan kotor"]),orders:nv(r["Pesanan SKU"]),views:nv(r["Tayangan LIVE"])}));

async function analyze(file){
  try{
    const wb=await readBook(file),first=sheetRows(wb.Sheets[wb.SheetNames[0]]),hdr=new Set((first.find(r=>r.filter(c=>clean(c)).length>2)||[]).map(clean));
    const SKIP=(label,why)=>({kind:"skip",name:file.name,label,why});
    /* ---- Shopee ---- */
    if(wb.SheetNames.includes("Penghasilan")&&wb.SheetNames.includes("Summary"))return parseShopeeIncome(wb,file.name);
    if(hdr.has("No. Pesanan")&&hdr.has("Nomor Referensi SKU"))return parseShopeeOrders(table(first,"No. Pesanan"),file.name);
    if(wb.SheetNames.some(n=>/Performa Terbaik/i.test(n)))return SKIP("Detail produk (parent SKU) Shopee","Penjualan per produk sudah dihitung dari file pesanan.");
    if(hdr.has("Nama Iklan")&&hdr.has("Efektifitas Iklan")){
      const pl=first.find(r=>clean(r[0])==="Periode"),pm=pl&&/(\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\d{2})\/(\d{2})\/(\d{4})/.exec(clean(pl[1])),per=pm?[`${pm[3]}-${pm[2]}-${pm[1]}`,`${pm[6]}-${pm[5]}-${pm[4]}`]:(periodFromName(file.name)||[M()+"-01",endOf(M())]);
      const rows=(table(first,"Urutan")||[]).filter(r=>r["Nama Iklan"]).map(r=>({name:r["Nama Iklan"].slice(0,90),status:clean(r["Status"]),mode:clean(r["Mode Bidding"]),code:clean(r["Kode Produk"]),views:nv(r["Dilihat"]),clicks:nv(r["Jumlah Klik"]),cart:nv(r["Tambah ke Keranjang"]),conv:nv(r["Konversi"]),units:nv(r["Produk Terjual"]),gmv:nv(r["Omzet Penjualan"]),gmvd:nv(r["Penjualan Langsung (GMV Langsung)"]),spend:nv(r["Biaya"])}));
      return{kind:"report",ch:SP,rkind:"shopeeads",name:file.name,label:"Laporan iklan Shopee (per kampanye)",rows,from:per[0],to:per[1]};}
    if(hdr.has("Kode Pesanan")&&hdr.has("Username Affiliate"))return parseShopeeAnalytics("shopeeaff",wb,file.name);
    if(hdr.has("Pengunjung Produk (Kunjungan)")&&hdr.has("Pengunjung Produk (Menambahkan Produk ke Keranjang)"))return parseShopeeAnalytics("shopeefunnel",wb,file.name);
    if(wb.SheetNames.some(n=>/^Asal Kunjungan/i.test(n))&&wb.SheetNames.includes("Pesanan Dibuat"))return parseShopeeAnalytics("shopeesource",wb,file.name);
    if(hdr.has("Rata-rata Waktu Dihabiskan"))return SKIP("Traffic overview Shopee","Pengunjung harian sudah diambil dari file product overview, dan total pengunjung dari statistik toko.");
    if(hdr.has("Penjualan per Pembeli (Pesanan Dibuat)")||(hdr.has("Total Pengunjung (Kunjungan)")&&hdr.has("Total Pembeli (Pesanan Dibuat)")))return SKIP("Sales overview Shopee","Isinya sama dengan statistik toko; penjualan dihitung dari file pesanan.");
    if(hdr.has("Kategori Shopee"))return SKIP("Komposisi penjualan Shopee","Semua produk ada di satu kategori; penjualan sudah dihitung dari file pesanan.");
    if(hdr.has("Rasio Penjualan")&&hdr.has("Kode Produk"))return SKIP("Trafik kartu produk Shopee","Penjualan per produk sudah dihitung dari file pesanan; corong pengunjung diambil dari product overview.");
    if(hdr.has("Nama Voucher")||(wb.SheetNames.includes("Rincian Performa")&&hdr.has("Klaim")))return SKIP("Performa voucher Shopee","Nilai voucher yang ditanggung penjual sudah tercatat per pesanan di file penghasilan, jadi tidak dipakai supaya tidak dobel.");
    if(hdr.has("Tipe Promosi"))return SKIP("Performa diskon Shopee","Diskon penjual sudah tercermin di harga per pesanan (file pesanan).");
    if(wb.SheetNames.includes("Tren Metrik"))return SKIP("Flash sale toko Shopee","Penjualan flash sale sudah termasuk di file pesanan.");
    /* ---- TikTok ---- */
    if(wb.SheetNames.some(sn=>sheetRows(wb.Sheets[sn]).some(r=>r.some(c=>clean(c)==="Jumlah penyelesaian pembayaran"))))return parseIncome(wb,file.name);
    const t=k=>table(first,k);
    if(hdr.has("Order ID")&&hdr.has("Seller SKU"))return parseOrders(t("Order ID"),file.name);
    if(hdr.has("Klik Unik")&&hdr.has("Waktu"))return parseAds("cardtraffic",t("Waktu"),file.name);
    if(hdr.has("Siaran LIVE")&&hdr.has("Waktu"))return parseAds("livedaily",t("Waktu"),file.name);
    if(hdr.has("SKU ID")&&hdr.has("Produk terjual"))return{kind:"skip",name:file.name,label:"Daftar SKU",why:"Penjualan per SKU sudah dihitung dari file pesanan."};
    if(first.slice(0,4).some(r=>/Tanggal analisis/i.test(clean(r[0])))||(first[2]||[]).length>100)return{kind:"skip",name:file.name,label:"Daftar produk per saluran",why:"Omzet per saluran (video, LIVE, kartu produk, afiliasi) sudah dihitung dari file pesanan."};
    if(hdr.has("Per Hari"))return parseAds("adsdaily",t("Per Hari"),file.name);
    if(hdr.has("Time")&&hdr.has("Biaya"))return parseAds("adshourly",t("Time"),file.name);
    if(hdr.has("ID live room")&&/Campaign_\d+/.test(file.name))return SKIP("Sesi LIVE satu kampanye","Sesi yang sama sudah ada di file Livestream data (semua kampanye), jadi tidak dipakai supaya tidak dobel.");
    if(hdr.has("ID live room"))return parseAds("live",t("ID live room"),file.name);
    if(hdr.has("Anggaran saat ini"))return parseAds(hdr.has("Tayangan LIVE")?"livecampaign":"prodcampaign",t("ID Campaign"),file.name);
    if(hdr.has("ID postingan"))return parseAds(hdr.has("Nama produk")?"creativeprod":"creative",t("ID postingan"),file.name);
    if(hdr.has("Nama produk")&&hdr.has("Nama kampanye"))return parseAds("product",t("Nama produk"),file.name);
    if(hdr.has("Nama produk")&&hdr.has("ID produk"))return{kind:"skip",name:file.name,label:"Data produk satu kampanye",why:"Sudah tercakup di file Product data (semua kampanye)."};
    return{kind:"skip",name:file.name,label:"Tidak dikenali",why:"Format file ini belum didukung."};
  }catch(e){return{kind:"skip",name:file.name,label:"Gagal dibaca",why:String(e.message||e)};}
}

/* one row per calendar day: sales, marketplace costs, HPP, ads and ad-efficiency ratios */
function dailyStats(m=M(),ch="Semua"){
  const start=m+"-01",end=endOf(m),n=lastDay(m),want=c=>ch==="Semua"||c===ch;
  const D=Array.from({length:n},(_,i)=>({date:`${m}-${String(i+1).padStart(2,"0")}`,d:i+1,n:0,gross:0,fee:0,refund:0,hpp:0,units:0,ads:0,adsGmv:0,adsOrders:0,impr:0,clicks:0,adsData:false,ttAds:0,spAds:0,ttCtr:false,spCtr:false}));
  const at=date=>D[+date.slice(8,10)-1];
  for(const o of ORD())if((o.date||"").slice(0,7)===m&&counts(o)&&want(o.channel)){const t=orderTotals(o),x=at(o.date);x.n++;x.gross+=t.gross;x.fee+=t.fee;x.refund+=t.refund||0;x.hpp+=t.hpp;x.units+=t.qty;}
  if(want(TT)){
    for(const a of S.adsdaily)if(a.date>=start&&a.date<=end){const x=at(a.date);x.ads+=+a.spend||0;x.adsGmv+=+a.gmv||0;x.adsOrders+=+a.orders||0;x.ttAds+=+a.spend||0;x.adsData=true;}
    for(const r of S.adsreports)if((r.ch||TT)===TT&&(r.kind==="creative"||r.kind==="creativeprod")&&r.from===r.to&&r.from>=start&&r.from<=end){const x=at(r.from);for(const y of r.rows||[]){x.impr+=+y.impr||0;x.clicks+=+y.clicks||0;}x.ttCtr=true;}
  }
  if(want(SP))for(const r of shopeeAdsSet()){
    const t=k=>(r.rows||[]).reduce((a,y)=>a+(+y[k]||0),0),tot={ads:r.spend,adsGmv:t("gmv"),adsOrders:t("conv"),impr:t("views"),clicks:t("clicks")};
    for(let dt=r.from;dt<=r.to;dt=addDays(dt,1))if(dt>=start&&dt<=end){const x=at(dt);for(const [k,v] of Object.entries(tot))x[k]+=v/r.len;x.spAds+=r.spend/r.len;x.adsData=true;x.spCtr=true;}
  }
  for(const c of S.cash)if((c.date||"").slice(0,7)===m&&c.type==="keluar"&&((c.category==="Iklan TikTok"&&want(TT))||(c.category==="Iklan Shopee"&&want(SP))))at(c.date).ads+=+c.amount||0;
  let prev=null;
  for(const x of D){
    x.cm=x.gross-x.fee-x.refund-x.hpp;x.profit=x.cm-x.ads;
    x.roas=x.ads?x.adsGmv/x.ads:null;x.be=x.cm>0?x.gross/x.cm:null;x.cpo=x.adsOrders?x.ads/x.adsOrders:null;
    x.roi=x.ads?x.profit/x.ads:null;x.aov=x.n?x.gross/x.n:null;x.acos=x.adsGmv?x.ads/x.adsGmv:null;x.acosBe=x.gross?x.cm/x.gross:null;
    x.ctr=x.impr&&(!x.ttAds||x.ttCtr)&&(!x.spAds||x.spCtr)?x.clicks/x.impr:null;x.tacos=x.gross?x.ads/x.gross:null;
    x.growth=prev&&prev.gross?(x.gross-prev.gross)/prev.gross:null;if(x.n||x.ads)prev=x;
  }
  return D;
}

app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-team]");if(!b)return;const a=b.dataset.team,id=b.dataset.id;
  try{
    if(a==="req"){const label=document.getElementById("reqName").value.trim();if(!label){toast("Isi nama dulu");return;}
      const d={label,want:document.getElementById("reqRole").value,at:Date.now()};await S.db.doc("teamreq/"+ME.id).set(d);ME.req=d;toast("Permintaan terkirim");render();return;}
    const role=app.querySelector(`[data-role-of="${id}"]`)?.value;
    if(a==="ok"){const r=S.teamreq.find(x=>x.id===id);await S.db.doc("team/"+id).set({role,label:r?.label||"",at:Date.now()});await S.db.doc("teamreq/"+id).delete();toast("Akses disetujui");}
    else if(a==="no"){await S.db.doc("teamreq/"+id).delete();toast("Permintaan ditolak");}
    else if(a==="set"){const t=S.team.find(x=>x.id===id);await S.db.doc("team/"+id).set({role,label:t?.label||"",at:Date.now()});toast("Peran disimpan");}
    else if(a==="del"){await S.db.doc("team/"+id).delete();toast("Akses dicabut");}
  }catch(err){toast(errMsg(err));}
});
app.addEventListener("click",e=>{
  const t=e.target;
  const ch=t.closest("[data-chan]");if(ch){salesFilter=ch.dataset.chan;render();return;}
  const adc=t.closest("[data-adsch]");if(adc){adsCh=adc.dataset.adsch;render();return;}
  const dch=t.closest("[data-dailych]");if(dch){dailyCh=dch.dataset.dailych;render();return;}
  const ac=t.closest("[data-acc]");if(ac){bankAcc=ac.dataset.acc;render();return;}
  if(!S.canWrite)return;
  const ea=t.closest("[data-edit-acc]");if(ea){openForm("account",ea.dataset.editAcc);return;}
  const pay=t.closest("[data-pay]");if(pay){const r=byId("recurring",pay.dataset.pay);openForm("cost",null,{type:"keluar",category:r.category,amount:r.amount,account:r.account,note:r.name,recurringId:r.id,date:defDate()});return;}
  const ps=t.closest("[data-paysup]");if(ps){openForm("appay",null,{supplier:ps.dataset.paysup});return;}
  const pi=t.closest("[data-payinv]");if(pi){const b=byId("purchases",pi.dataset.payinv)||byId("apopen",pi.dataset.payinv),iv=apState()[skey(b.supplier)]?.inv.find(i=>i.id===b.id);openForm("appay",null,{supplier:supName(b.supplier),purchaseId:b.id,amount:iv?Math.round(iv.left*100)/100:""});return;}
  const rv=t.closest("[data-recv]");if(rv){const[c,m]=rv.dataset.recv.split("|");openForm("receipt",null,{channel:c,period:m});return;}
  const nw=t.closest("[data-new]");if(nw){openForm(nw.dataset.new);return;}
  const ed=t.closest("[data-edit]");if(ed){openForm(ed.dataset.edit,ed.dataset.id);return;}
  if(t.id==="saveSet")saveSettings();
  if(t.closest("[data-import]")){openImport();return;}
  if(t.closest("[data-more]")){salesLimit+=300;render();return;}
  if(t.id==="delImp"){if(t.dataset.ok){t.disabled=true;t.textContent="Menghapus…";deleteImports().catch(()=>toast("Sebagian data gagal dihapus. Coba lagi."));}else{t.dataset.ok=1;t.textContent="Klik lagi untuk menghapus semua data impor";}return;}
});

const COLL={apopen:"apopen",supplier:"suppliers",appay:"appay",cret:"returns",sret:"supreturns",pricing:"products",matcost:"materials",order:"orders",buy:"purchases",product:"products",material:"materials",buka:"production",packing:"production",prod:"production",cash:"cash",cost:"cash",asset:"cash",move:"moves",account:"accounts",transfer:"transfers",receipt:"receipts",recurring:"recurring"};
let cur=null;
const prodOptions=(sel,only)=>`<option value="">Pilih produk…</option>`+sortBy("products").filter(p=>(p.active!==false||p.id===sel)&&(!only||only(p))).map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("");
const matOptions=sel=>`<option value="">Pilih bahan…</option>`+sortBy("materials").filter(m=>m.role!=="piece"||m.id===sel).map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.name)} (${esc(m.unit||"pcs")})</option>`).join("");
const targetOptions=sel=>`<optgroup label="Pack siap kirim">${sortBy("products").filter(p=>p.stocked).map(p=>`<option value="p:${p.id}" ${"p:"+p.id===sel?"selected":""}>${esc(p.name)} (pack)</option>`).join("")}</optgroup><optgroup label="Bahan & kemasan">${sortBy("materials").filter(m=>!NOSTOCK(m)).map(m=>`<option value="m:${m.id}" ${"m:"+m.id===sel?"selected":""}>${esc(m.name)} (${esc(m.unit||"pcs")})</option>`).join("")}</optgroup>`;
const accOptions=sel=>sortAcc().map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)}</option>`).join("");
const defAcc=kind=>{const a=sortAcc();return(a.find(x=>x.type===kind)||a[0])?.id;};
const opt=(arr,v)=>arr.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}" ${val===v?"selected":""}>${esc(lab)}</option>`}).join("");
const F=(label,inner,span)=>`<label class="field"${span?' style="grid-column:1/-1"':""}><span>${label}</span>${inner}</label>`;
const inp=(name,v,type="text",extra="")=>`<input name="${name}" type="${type}" value="${esc(v??"")}" ${extra}>`;
const money=(name,v,req)=>inp(name,v,"number",`min="0" step="0.01" inputmode="decimal" ${req?"required":""}`);

function itemRow(kind,it={}){
  if(kind==="order")return`<div class="item">${F("Produk",`<select name="pid" required>${prodOptions(it.productId)}</select>`)}${F("Qty",inp("qty",it.qty??1,"number",'min="1" step="1" required'))}${F("Harga satuan",money("price",it.price,1))}<button type="button" class="btn sm" data-rm aria-label="Hapus baris">✕</button></div>`;
  return`<div class="item">${F("Barang",`<select name="pid" required>${matOptions(it.materialId)}</select>`)}${F("Qty",inp("qty",it.qty??1,"number",'min="1" step="1" required'))}${F("Harga beli per unit",money("price",it.cost,1))}<button type="button" class="btn sm" data-rm aria-label="Hapus baris">✕</button></div>`;
}

function openForm(kind,id,preset){
  if(!S.canWrite)return;

  const rec=id?byId(COLL[kind],id):null;
  if(id&&!rec){toast("Data ini sudah dihapus");return;}
  if(kind==="prod")kind=rec.type==="buka"?"buka":"packing";
  if(kind==="cash"&&rec&&rec.type==="keluar")kind=rec.category===ASSET?"asset":NON_PL.includes(rec.category)?"cash":"cost";
  if(kind==="cost"&&rec?.category===ASSET)kind="asset";
  cur={kind,id,confirmDel:false,recurringId:rec?.recurringId||preset?.recurringId||null};

    const isMp=MP.includes(r.channel||"Shopee");

      ${F("Tanggal",inp("date",r.date||defDate(),"date","required"))}${F("Channel",`<select name="channel" id="ochan">${opt(CHANNELS,r.channel||"Shopee")}</select>`)}
      ${F("No. pesanan",inp("ref",r.ref,"text",'placeholder="opsional"'))}${F("Status",`<select name="status">${opt(Object.entries(ORDER_ST).map(([k,v])=>[k,v[0]]),r.status||"selesai")}</select>`)}</div>
      <div class="items" id="items">${(r.items?.length?r.items:[{}]).map(it=>itemRow("order",it)).join("")}</div>
      <div><button type="button" class="btn sm" data-add>+ Tambah produk</button></div>
      <div class="fgrid">${F("Potongan marketplace (admin, layanan, voucher toko)",money("fee",r.fee??0))}
      <label class="field" id="oaccWrap" ${isMp?"hidden":""}><span>Uang diterima di</span><select name="account">${accOptions(r.account||defAcc("kas"))}</select></label>
      ${F("Catatan",inp("note",r.note))}</div>
      <p class="hint" id="ohint">${isMp?"Pesanan marketplace dicatat sebagai piutang sampai dananya dicairkan.":"Pesanan offline langsung menambah saldo rekening yang dipilih."}</p>

  }else if(kind==="buy"){
    f=`<h2>${id?"Ubah pembelian":"Pembelian baru"}</h2><div class="fgrid">

function updateSum(){
  const k=cur.kind;
  if(k==="receipt"){const el=document.getElementById("rhint");const R=receivables("9999-12-31"),r=R[dform.channel.value]?.[dform.period.value];let left=r?r.left:0;
    const self=cur.id?byId("receipts",cur.id):null;if(self&&self.channel===dform.channel.value&&self.period===dform.period.value)left+=+self.amount||0;
    el.textContent=r?`Sisa piutang ${dform.channel.value} untuk pesanan ${mname(dform.period.value)}: ${rp(left)} (dari nilai bersih ${rp(r.net)}).`:`Belum ada pesanan ${dform.channel.value} di bulan ini.`;return;}
  if(k==="account"&&cur.id){const el=document.getElementById("kline"),kb=dform.knownBal.value,kd=dform.knownDate.value;
    if(kb===""||!kd){el.textContent="";return;}const mv=ledger().filter(l=>l.acc===cur.id&&l.date<=kd).reduce((a,l)=>a+l.amt,0),op=+kb-mv;
    el.innerHTML=`Transaksi tercatat sampai ${fdate(kd)}: ${rp(mv)}. Saldo awal = ${rp(+kb)} − ${rp(mv)} = <b>${rp(op)}</b>. Angka ini dipakai saat disimpan.`;cur.opening=op;return;}
  if(k==="appay"){return;}
  if(k==="cret"){const el=document.getElementById("cline"),p=byId("products",dform.productId.value),q=+dform.qty.value||0,ref=dform.ref.value.trim(),cond=dform.cond.value;
    document.getElementById("casWrap").hidden=!(p?.stocked&&cond==="baik");
    const o=ref&&ORD().find(o=>o.ref===ref||o.id===ref);let msg="";
    if(o&&o.status==="gagal")msg=`Pesanan ${esc(ref)} batal setelah dikirim: stoknya sudah berkurang saat paket diambil ekspedisi, jadi catat retur ini saat paket kembali. `;
    else if(o&&!counts(o))msg=`<span class="neg">Pesanan ${esc(ref)} berstatus ${(ORDER_ST[o.status]||[o.status])[0].toLowerCase()}: stoknya tidak pernah dikurangi, jadi jangan dicatat sebagai retur supaya stok tidak bertambah dua kali.</span> `;
    else if(o)msg=`Pesanan ditemukan: ${o.items.map(it=>`${esc(pname(it.productId,pmap()))} ×${num(it.qty)}`).join(", ")} (${fdate(o.date)}). `;
    else if(ref)msg="Nomor pesanan tidak ditemukan di aplikasi (mungkin pesanan sebelum aplikasi dipakai). Tetap bisa disimpan. ";
    if(p)msg+=cond!=="baik"?"Barang rusak: dicatat, stok tidak bertambah.":p.stocked&&dform.as.value==="pack"?`Stok pack ${esc(p.name)} +${num(q)}.`:`Piece sabun lepas +${num(q*(+p.pcs||0))}.`;
    el.innerHTML=msg;return;}
  if(k==="sret"){const el=document.getElementById("sumline");let g=0;dform.querySelectorAll(".item").forEach(r=>g+=(+r.querySelector("[name=qty]").value||0)*(+r.querySelector("[name=price]").value||0));
    document.getElementById("saccWrap").hidden=dform.settle.value!=="refund";
    el.textContent=`Nilai retur ${rp(g)}. Stok bahan berkurang sesuai jumlah di atas. ${dform.settle.value==="refund"?"Saldo rekening yang dipilih bertambah.":dform.settle.value==="potong"?"Hutang ke supplier ini berkurang.":"Tidak ada uang yang berpindah."}`;return;}
  if(k==="buka"){document.getElementById("bkline").textContent=`= +${num((+dform.qty.value||0)*cur.perK)} piece sabun lepas.`;return;}
  if(k==="packing"){const p=byId("products",dform.productId.value),q=+dform.qty.value||0;document.getElementById("pkline").textContent=p?`Memakai ${num(q*(+p.pcs||0))} piece sabun dan ${num(q)} bubble mailer → +${num(q)} pack ${p.name}.`:"";return;}
  const el=document.getElementById("sumline");if(!el)return;let g=0;
  const rows=[...dform.querySelectorAll(".item")];
  rows.forEach(r=>g+=(+r.querySelector("[name=qty]").value||0)*(+r.querySelector("[name=price]").value||0));
  if(k==="order"){
    const fee=+dform.fee.value||0;el.textContent=`Kotor ${rp(g)} · Potongan ${rp(fee)} · Bersih ${rp(g-fee)}`;
    const s=stockOf(),needP={},pack={};let piece=0;
    const self=cur.id?byId("orders",cur.id):null;
    if(self&&leftStock(self))for(const it of self.items||[]){const p=byId("products",it.productId);if(p?.stocked)s.P[p.id]+= +it.qty||0;else if(s.PC)s.Mt[s.PC]+=(+it.qty||0)*(+p?.pcs||0);}
    rows.forEach(r=>{const p=byId("products",r.querySelector("[name=pid]").value),q=+r.querySelector("[name=qty]").value||0;if(!p)return;if(p.stocked)needP[p.id]=(needP[p.id]||0)+q;else piece+=q*(+p.pcs||0);});
    const msg=[];for(const id in needP){if(needP[id]>(s.P[id]||0))msg.push(`stok pack ${byId("products",id).name} tinggal ${num(s.P[id]||0)}`);}
    if(piece&&piece>(s.Mt[s.PC]||0))msg.push(`piece sabun lepas tinggal ${num(s.Mt[s.PC]||0)} (butuh ${num(piece)})`);
    const sl=document.getElementById("stockline");sl.textContent=msg.length?"Perhatian: "+msg.join("; ")+". Lakukan packing atau buka karton.":(piece?`Akan memakai ${num(piece)} piece sabun lepas.`:"");sl.className=msg.length?"hint neg":"hint";
  }else el.textContent=`Total ${rp(g+(+dform.extra.value||0))}`;
}

  updateSum();

  }else if(k==="buka"){if(!roleId("karton")||!roleId("piece")){toast("Tambahkan bahan karton dan piece sabun dulu");return;}data={date:g("date"),type:"buka",qty:+g("qty")||0,perUnit:cur.perK,note:g("note")};
  }else if(k==="packing"){if(!roleId("piece")){toast("Tambahkan bahan piece sabun dulu");return;}data={date:g("date"),type:"packing",productId:g("productId"),qty:+g("qty")||0,note:g("note")};

function errMsg(err){
  if(err?.code==="42501"||/row-level security/i.test(err?.message||""))return"Akun ini tidak punya izin mengubah data ini.";
  if(err?.code==="invalid_argument"){S.canWrite=false;pendingRender=true;return"Akun ini hanya bisa melihat data, tidak bisa mengubah.";}
  if(err?.code==="quota_exceeded")return"Penyimpanan penuh. Hapus data lama dulu.";
  return"Gagal menyimpan. Periksa koneksi lalu coba lagi.";
}
