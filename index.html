  }else if(k==="supplier"){if(S.suppliers.some(x=>skey(x.name)===skey(g("name"))&&x.id!==cur.id)){toast("Supplier dengan nama ini sudah ada");return;}data={name:g("name"),term:+g("term")||0,note:g("note")};
  }else if(k==="appay"){if(!g("supplier")){toast("Pilih supplier");return;}data={date:g("date"),supplier:g("supplier"),purchaseId:g("purchaseId"),amount:+g("amount")||0,account:g("account"),note:g("note")};
  }else if(k==="cret"){const p=byId("products",g("productId"));data={date:g("date"),channel:g("channel"),ref:g("ref"),productId:g("productId"),qty:+g("qty")||0,cond:g("cond"),as:p?.stocked&&g("cond")==="baik"?g("as"):"piece",note:g("note")};
  }else if(k==="sret"){const its=items();if(!its.length){toast("Pilih minimal satu barang");return;}const st=g("settle");
    data={date:g("date"),supplier:g("supplier"),settle:st,account:st==="refund"?g("account"):"",note:g("note"),items:its.map(i=>({materialId:i.id,qty:i.qty,cost:i.price}))};
  }else if(k==="kirim"){const its=S.products.map(p=>({productId:p.id,qty:Math.round(+g("q_"+p.id)||0)})).filter(i=>i.qty>0);if(!its.length){toast("Isi jumlah minimal satu produk");return;}
    data={date:g("date"),type:"kirim",channel:g("channel"),resi:+g("resi")||0,note:g("note"),items:its};
  }else if(k==="opname"){const d=g("date"),s=stockOf(d),w=[];
    for(const [key,val] of fd.entries()){if(!key.startsWith("o_")||String(val).trim()==="")continue;const t=key.slice(2),[a,i]=t.split(":"),sys=a==="p"?(s.P[i]||0):(s.Mt[i]||0),diff=(+val)-sys;
      if(diff)w.push({date:d,type:"opname",target:t,qty:diff,note:`Stock opname: sistem ${num(sys)} → fisik ${num(+val)}`,created:Date.now()});}
    if(!w.length){toast("Tidak ada selisih. Stok sistem sudah sama dengan fisik.");return;}
    try{for(const x of w)await S.db.collection("moves").doc().set(x);dlg.close();toast(`${w.length} koreksi opname disimpan`);}catch(err){toast(errMsg(err));}return;
  }else if(k==="move"){data={date:g("date"),type:g("type"),target:g("target"),qty:+g("qty")||0,note:g("note")};
  }else if(k==="account"){data={name:g("name"),type:g("type"),opening:(cur.id&&g("knownBal")!==""&&cur.opening!=null)?Math.round(cur.opening*100)/100:+g("opening")||0};if(g("sort")!=="")data.sort=+g("sort");
  }else if(k==="transfer"){if(g("from")===g("to")){toast("Rekening asal dan tujuan harus berbeda");return;}data={date:g("date"),from:g("from"),to:g("to"),amount:+g("amount")||0,note:g("note")};
  }else if(k==="receipt"){const type=g("type");data={date:g("date"),channel:g("channel"),period:g("period"),type,amount:+g("amount")||0,account:type==="pencairan"?g("account"):"",note:g("note")};
  }else if(k==="recurring"){data={name:g("name"),category:g("category"),amount:+g("amount")||0,account:g("account"),active:g("active")==="1"};if(g("sort")!=="")data.sort=+g("sort");}
  data.created=prev?.created||Date.now();
  try{const c=S.db.collection(COLL[k]);await(cur.id?c.doc(cur.id):c.doc()).set(data);dlg.close();toast(cur.id?"Perubahan disimpan":"Tersimpan");}catch(err){toast(errMsg(err));}
});
async function saveSettings(){
  const arOpening={};MP.forEach((ch,i)=>arOpening[ch]=+document.getElementById("setAr"+i).value||0);
  try{await S.db.doc("config/main").set({...S.settings,storeName:document.getElementById("setName").value.trim()||"KISO.ID",arOpening,kilatOn:!!document.getElementById("setKilat").value,stockFrom:document.getElementById("setStockMode").value?(document.getElementById("setStockFrom").value||today()):"",kilatFrom:document.getElementById("setKilatFrom").value||""});toast("Pengaturan disimpan");}catch(err){toast(errMsg(err));}
}
function errMsg(err){
  if(err?.code==="42501"||/row-level security/i.test(err?.message||""))return"Akun ini tidak punya izin mengubah data ini.";
  if(err?.code==="invalid_argument"){S.canWrite=false;pendingRender=true;return"Akun ini hanya bisa melihat data, tidak bisa mengubah.";}
  if(err?.code==="quota_exceeded")return"Penyimpanan penuh. Hapus data lama dulu.";
  return"Gagal menyimpan. Periksa koneksi lalu coba lagi.";
}

/* ---------- data (web version: Supabase database + ID/password login) ---------- */
const CFG=window.KISO_CONFIG||{};
const AUTH={state:"loading",err:"",first:false};
const toEmail=u=>`${String(u).trim().toLowerCase()}@${CFG.userDomain||"kiso-backoffice.app"}`;
const okUser=u=>/^[a-z0-9._-]{3,30}$/.test(String(u).trim().toLowerCase());
let SB=null;

/* Same calls the app already makes (collection().onSnapshot, doc().set/delete/get), backed by one Supabase table "docs" */
function makeDb(sb){
  const st={},rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const snapOf=c=>({docs:[...st[c].rows].map(([id,d])=>({id,data:()=>d}))});
  const emit=c=>{for(const f of st[c].cbs)f();};
  async function fetchColl(c){const rows=new Map();for(let from=0;;from+=1000){const{data,error}=await sb.from("docs").select("id,data").eq("coll",c).order("id").range(from,from+999);if(error)throw error;for(const r of data)rows.set(r.id,r.data);if(data.length<1000)break;}return rows;}
  function watch(c,f,err){
    if(!st[c]){st[c]={rows:new Map(),cbs:new Set()};st[c].p=fetchColl(c).then(r=>{st[c].rows=r;}).catch(e=>{st[c].err=e;});}
    st[c].cbs.add(f);st[c].p.then(()=>{if(st[c].err)err&&err(st[c].err);else f();});
  }
  async function refresh(c,id){const{data}=await sb.from("docs").select("data").eq("coll",c).eq("id",id).maybeSingle();if(data)st[c].rows.set(id,data.data);else st[c].rows.delete(id);emit(c);}
  sb.channel("kiso-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const r=p.eventType==="DELETE"?p.old:p.new;if(!r||!r.coll||!st[r.coll])return;
    if(p.eventType==="DELETE"){st[r.coll].rows.delete(r.id);emit(r.coll);}else refresh(r.coll,r.id).catch(()=>{});
  }).subscribe();
  const ref=(c,id)=>({
    async set(d){const body=JSON.parse(JSON.stringify(d));const{error}=await sb.from("docs").upsert({coll:c,id,data:body,updated_at:new Date().toISOString()});if(error)throw error;if(st[c]){st[c].rows.set(id,body);emit(c);}},
    async delete(){const{data,error}=await sb.from("docs").delete().eq("coll",c).eq("id",id).select("id");if(error)throw error;if(!data.length&&st[c]?.rows.has(id))throw{code:"42501"};if(st[c]){st[c].rows.delete(id);emit(c);}},
    async get(){const{data,error}=await sb.from("docs").select("data").eq("coll",c).eq("id",id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data?.data};},
    onSnapshot(f,err){watch(c,()=>{const d=st[c].rows.get(id);f({id,exists:d!==undefined,data:()=>d});},err);},
  });
  return{
    collection:c=>({onSnapshot:(f,err)=>watch(c,()=>f(snapOf(c)),err),doc:id=>ref(c,id||rid())}),
    doc:p=>{const i=p.indexOf("/");return ref(p.slice(0,i),p.slice(i+1));},
  };
}

/* ---------- login & account ---------- */
V.login=()=>{
  if(AUTH.state==="setup")return`<div class="panel" style="max-width:560px;margin:40px auto"><h2>Aplikasi belum tersambung ke database</h2><p class="hint">Isi alamat proyek dan anon key Supabase di file <b>config.js</b>, lalu muat ulang halaman. Langkahnya ada di README.</p></div>`;
  if(AUTH.state==="loading")return`<div class="hint" style="margin:40px auto;text-align:center">Memuat…</div>`;
  if(AUTH.state==="noprof")return`<div class="panel" style="max-width:460px;margin:40px auto"><h2>Akun belum punya akses</h2><p class="hint">Akun ini aktif, tapi belum diberi peran atau sedang dinonaktifkan. Hubungi CEO.</p><div><button class="btn" data-auth="logout">Keluar</button></div></div>`;
  const f=AUTH.first;
  return`<form class="panel" id="loginForm" style="max-width:400px;margin:48px auto;display:grid;gap:12px" autocomplete="on">
    <div><h2 style="margin:0">${esc(S.settings.storeName||"KISO.ID")} Back Office</h2><p class="hint" style="margin:4px 0 0">${f?"Belum ada pengguna. Buat akun pertama; akun ini otomatis menjadi CEO.":"Masuk dengan ID dan password dari CEO."}</p></div>
    ${f?`<label class="field"><span>Nama</span><input name="name" required autocomplete="name"></label>`:""}
    <label class="field"><span>ID pengguna</span><input name="user" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="mis. budi"></label>
    <label class="field"><span>Password</span><input name="pass" type="password" required autocomplete="${f?"new-password":"current-password"}" minlength="6"></label>
    ${AUTH.err?`<div class="banner" style="margin:0">${esc(AUTH.err)}</div>`:""}
    <button class="btn pri" type="submit">${f?"Buat akun CEO":"Masuk"}</button>
  </form>`;
};
async function doLogin(fd){
  const user=fd.get("user").trim().toLowerCase(),pass=fd.get("pass");AUTH.err="";
  if(!okUser(user)){AUTH.err="ID hanya boleh huruf kecil, angka, titik, strip; 3–30 karakter.";render();return;}
  if(AUTH.first){
    const{error}=await SB.auth.signUp({email:toEmail(user),password:pass});
    if(error){AUTH.err=error.message;render();return;}
    const{data:s}=await SB.auth.getSession();if(!s.session){AUTH.err="Akun dibuat tapi belum bisa masuk. Matikan \"Confirm email\" di Supabase (lihat README), lalu masuk lagi.";AUTH.first=false;render();return;}
    await SB.rpc("bootstrap_ceo",{p_username:user,p_name:fd.get("name").trim()});
    await startApp(s.session);return;
  }
  const{data,error}=await SB.auth.signInWithPassword({email:toEmail(user),password:pass});
  if(error){AUTH.err="ID atau password salah.";render();return;}
  await startApp(data.session);
}
async function startApp(session){
  ME.uid=session.user.id;
  const{data:prof}=await SB.from("profiles").select("*").eq("user_id",ME.uid).maybeSingle();
  if(!prof||!prof.active||!ROLES[prof.role]){AUTH.state="noprof";render();return;}
  ME.prof=prof;ME.role=prof.role;ME.id=ME.uid;ME.owner=false;ME.canLvl=ROLES[prof.role].write;
  S.canWrite=ROLES[prof.role].write;ME.ready=true;AUTH.state="in";
  const db=makeDb(SB);S.db=db;
  if(prof.role==="ceo")loadUsers();
  loadAudit();
  for(const name of COLLS)db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));DER=null;S.loaded[name]=1;render();},()=>{S.loaded[name]=1;render();});
  db.doc("config/main").onSnapshot(s=>{if(s.exists)S.settings={...S.settings,...s.data()};DER=null;S.loaded.settings=1;render();},()=>{S.loaded.settings=1;render();});
  render();
}
async function loadAudit(){
  const{data,error}=await SB.from("audit_log").select("*").order("at",{ascending:false}).limit(500);if(error)return;S.audit=data||[];render();
  let tm=null;SB.channel("kiso-audit").on("postgres_changes",{event:"INSERT",schema:"public",table:"audit_log"},p=>{S.audit.unshift(p.new);if(S.audit.length>800)S.audit.length=800;clearTimeout(tm);tm=setTimeout(render,400);}).subscribe();
}
async function loadUsers(){const{data}=await SB.from("profiles").select("*").order("created_at");S.users=data||[];render();}

/* CEO: user management + backup, shown at the top of Pengaturan */
function userPanel(){
  if(ME.role!=="ceo")return"";
  const U=S.users||[],sel=(v,attr)=>`<select ${attr}>${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===v?"selected":""}>${r.name}</option>`).join("")}</select>`;
  return`<div class="panel" style="max-width:900px"><h3>Pengguna & hak akses</h3>
  <div class="tbl"><table><thead><tr><th>Peran</th><th>Akses</th></tr></thead><tbody>${Object.values(ROLES).map(r=>`<tr><td><b>${r.name}</b></td><td class="wrapcell">${r.desc}</td></tr>`).join("")}</tbody></table></div>
  <div class="tbl" style="margin-top:12px"><table><thead><tr><th>ID</th><th>Nama</th><th>Peran</th><th>Status</th><th></th></tr></thead><tbody>
  ${U.map(u=>`<tr><td><b>${esc(u.username)}</b>${u.user_id===ME.uid?' <span class="pill acc">kamu</span>':""}</td><td>${esc(u.name||"")}</td><td>${sel(u.role,`data-urole="${u.user_id}" ${u.user_id===ME.uid?"disabled":""}`)}</td>
    <td><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-uactive="${u.user_id}" ${u.active?"checked":""} ${u.user_id===ME.uid?"disabled":""}> Aktif</label></td>
    <td class="n">${u.user_id===ME.uid?"":`<button class="btn sm" data-auth="usave" data-id="${u.user_id}">Simpan</button> <button class="btn sm" data-auth="upass" data-id="${u.user_id}">Ganti password</button>`}</td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin-top:14px">Tambah pengguna</h3>
  <form id="newUser" class="fgrid" autocomplete="off">
    <label class="field"><span>ID pengguna</span><input name="user" required autocapitalize="none" spellcheck="false" placeholder="huruf kecil, mis. gudang1"></label>
    <label class="field"><span>Nama</span><input name="name" required></label>
    <label class="field"><span>Peran</span>${sel("gudang",'name="role"')}</label>
    <label class="field"><span>Password awal</span><input name="pass" type="text" required minlength="6" autocomplete="new-password"></label>
    <div><button class="btn pri" type="submit">Buat pengguna</button></div>
  </form>
  <p class="hint">Berikan ID dan password awal ke orangnya; ia bisa menggantinya sendiri lewat tombol <b>Ganti password</b> di pojok kanan atas. Menonaktifkan pengguna langsung menutup semua aksesnya.</p></div>
  <div class="panel" style="max-width:900px"><h3>Cadangan data</h3>
  <p class="hint">Unduh seluruh data ke satu file sebagai cadangan, misalnya tiap akhir bulan. File yang sama bisa dipakai untuk memulihkan atau memindahkan data.</p>
  <div class="row"><button class="btn" data-auth="backup">Unduh cadangan (.json)</button><label class="btn">Pulihkan dari cadangan…<input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div></div>`;
}
function downloadBlob(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
async function backup(){
  const out={app:"kiso-backoffice",at:new Date().toISOString(),docs:{}};
  for(let from=0;;from+=1000){const{data,error}=await SB.from("docs").select("coll,id,data").order("coll").order("id").range(from,from+999);if(error)throw error;for(const r of data)(out.docs[r.coll]||={})[r.id]=r.data;if(data.length<1000)break;}
  downloadBlob(`kiso-backup-${today()}.json`,JSON.stringify(out));toast("Cadangan diunduh");
}
async function restore(file){
  const j=JSON.parse(await file.text());if(!j.docs)throw new Error("Bukan file cadangan KISO");
  const rows=[];for(const [c,docs] of Object.entries(j.docs))for(const [id,data] of Object.entries(docs))rows.push({coll:c,id,data,updated_at:new Date().toISOString()});
  for(let i=0;i<rows.length;i+=100){const{error}=await SB.from("docs").upsert(rows.slice(i,i+100));if(error)throw error;toast(`Memulihkan ${Math.min(i+100,rows.length)} / ${rows.length}…`);}
  toast(`${rows.length} dokumen dipulihkan. Memuat ulang…`);setTimeout(()=>location.reload(),1500);
}
function whoBar(){
  const el=document.getElementById("who");if(!el)return;
  el.innerHTML=AUTH.state==="in"?`<span class="hint">${esc(ME.prof.name||ME.prof.username)} · ${esc(ROLES[ME.role].name)}</span> <button class="btn sm" data-auth="mypass">Ganti password</button> <button class="btn sm" data-auth="logout">Keluar</button>`:"";
}
document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{await doLogin(new FormData(e.target));}finally{b.disabled=false;}}
  if(e.target.id==="newUser"){e.preventDefault();const fd=new FormData(e.target),user=fd.get("user").trim().toLowerCase();
    if(!okUser(user)){toast("ID hanya huruf kecil, angka, titik, strip; 3–30 karakter");return;}
    try{
      const tmp=supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"kiso-tmp"}});
      const{data,error}=await tmp.auth.signUp({email:toEmail(user),password:fd.get("pass")});
      if(error)throw error;if(!data.user?.id||data.user.identities?.length===0)throw new Error("ID sudah dipakai");
      const{error:e2}=await SB.from("profiles").insert({user_id:data.user.id,username:user,name:fd.get("name").trim(),role:fd.get("role"),active:true});if(e2)throw e2;
      toast(`Pengguna ${user} dibuat`);e.target.reset();loadUsers();
    }catch(err){toast("Gagal: "+(err.message||err));}}
});
document.addEventListener("change",e=>{if(e.target.id==="restoreFile"&&e.target.files[0]){restore(e.target.files[0]).catch(err=>toast("Gagal memulihkan: "+(err.message||err)));}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-auth]");if(!b)return;const a=b.dataset.auth,id=b.dataset.id;
  try{
    if(a==="logout"){await SB.auth.signOut();location.reload();}
    else if(a==="mypass"){const p=prompt("Password baru (minimal 6 karakter):");if(!p)return;if(p.length<6){toast("Minimal 6 karakter");return;}const{error}=await SB.auth.updateUser({password:p});if(error)throw error;toast("Password diganti");}
    else if(a==="usave"){const role=document.querySelector(`[data-urole="${id}"]`).value,active=document.querySelector(`[data-uactive="${id}"]`).checked;const{error}=await SB.from("profiles").update({role,active}).eq("user_id",id);if(error)throw error;toast("Disimpan");loadUsers();}
    else if(a==="upass"){const p=prompt("Password baru untuk pengguna ini (minimal 6 karakter):");if(!p)return;const{error}=await SB.rpc("admin_set_password",{p_user:id,p_password:p});if(error)throw error;toast("Password pengguna diganti");}
    else if(a==="backup"){b.disabled=true;await backup();b.disabled=false;}
  }catch(err){b.disabled=false;toast("Gagal: "+(err.message||err));}
});
render();
(async()=>{
  if(!window.supabase||!CFG.supabaseUrl||!CFG.supabaseAnonKey||/ISI_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)){AUTH.state="setup";render();return;}
  SB=supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const{data:{session}}=await SB.auth.getSession();
  if(session){await startApp(session);return;}
  const{data:has}=await SB.rpc("has_users");AUTH.first=has===false;AUTH.state="login";render();
})();

})();
</script>
